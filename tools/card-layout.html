<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Layout Editor</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; background: radial-gradient(ellipse at 50% 0%, #4a3523 0%, #21160e 60%, #120d09 100%) fixed; color: var(--parch); }
  .ed { display: grid; grid-template-columns: 250px 1fr 330px; grid-template-rows: auto 1fr; height: 100vh; }
  .ed-top { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: rgba(20,14,9,.7); flex-wrap: wrap; }
  .ed-top h1 { font-size: 20px; margin: 0; color: var(--gold-2); }
  .ed-status { opacity: .85; font-size: 14px; }
  .ed-status b { color: #f6d67a; }
  .ed-top .spacer { flex: 1; }
  .ed-list { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .ed-list .field { margin: 8px 8px 4px; width: auto; }
  .ed-filter { display: flex; gap: 4px; padding: 0 8px 6px; flex-wrap: wrap; }
  .ed-filter button { font-size: 12px; padding: 3px 7px; }
  .ed-items { overflow: auto; flex: 1; padding: 0 4px 10px; }
  .ed-item { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; background: none; border: 1px solid transparent; color: inherit; padding: 4px 6px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 14px; }
  .ed-item:hover { background: rgba(255,255,255,.05); }
  .ed-item.on { border-color: var(--gold); background: rgba(220,174,76,.12); }
  .ed-item .dot { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .ed-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ed-item .mk { font-size: 11px; flex: none; }
  .mk.draft { color: #f6b36a; }
  .mk.saved { color: #9fd18a; }
  .mk.noart { opacity: .45; }
  .ed-stage { overflow: auto; min-height: 0; padding: 16px 20px 40px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .ed-nav { display: flex; align-items: center; gap: 10px; }
  .ed-nav h2 { margin: 0; font-size: 18px; color: var(--gold-2); min-width: 260px; text-align: center; }
  .ed-big { position: relative; touch-action: none; user-select: none; }
  .ed-big .card { font-size: var(--ed-px, 25px); }
  .ed-big .card.small { font-size: var(--ed-px, 25px); }
  .ed-big .cf-art { cursor: grab; }
  .ed-big .cf-art.resize { cursor: ns-resize; }
  .ed-big .cf-cost, .ed-big .cf-tags, .ed-big .cf-req, .ed-big .cf-fp, .ed-big .cf-tokens, .ed-big .cf-title { cursor: move; }
  .ed-big .cf-body > * { cursor: ns-resize; }
  .ed-big [data-float], .ed-big [data-float] * { cursor: move; }
  .ed-big [data-float]:hover { outline: 1px dashed rgba(246,214,122,.8); outline-offset: 1px; }
  .ed-big .cf-body > *:hover, .ed-big .cf-cost:hover, .ed-big .cf-tags:hover, .ed-big .cf-req:hover, .ed-big .cf-fp:hover, .ed-big .cf-tokens:hover, .ed-big .cf-title:hover { outline: 1px dashed rgba(246,214,122,.8); outline-offset: 1px; }
  .ed-hl { outline: 2px solid #f6d67a !important; outline-offset: 2px; }
  .ed-help { font-size: 13px; opacity: .8; max-width: 640px; text-align: center; line-height: 1.4; }
  .ed-warn { background: rgba(163,50,42,.25); border: 1px solid #ffb3a1; color: #ffd4c8; padding: 5px 12px; border-radius: 8px; font-size: 14px; }
  .ed-ok { background: rgba(60,122,75,.22); border: 1px solid #9fd18a; color: #d8f0cc; padding: 5px 12px; border-radius: 8px; font-size: 14px; }
  .ed-sizes { display: flex; gap: 22px; align-items: flex-end; flex-wrap: wrap; justify-content: center; }
  .ed-sizes figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .ed-sizes figcaption { font-size: 12px; opacity: .75; }
  .ed-ctl { border-left: 1px solid var(--line); overflow: auto; min-height: 0; padding: 6px 12px 30px; }
  .ed-group { margin: 10px 0 4px; }
  .ed-group h3 { font-family: "Cinzel", var(--display); font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-2); margin: 0 0 4px; display: flex; align-items: center; }
  .ed-group h3 .muted { margin-left: auto; font-family: inherit; text-transform: none; letter-spacing: 0; font-size: 11px; }
  .ed-row { display: grid; grid-template-columns: 96px 1fr 44px 20px; gap: 6px; align-items: center; font-size: 13px; padding: 2px 0; }
  .ed-row input[type=range] { width: 100%; accent-color: #dcae4c; }
  .ed-row .val { text-align: right; font-variant-numeric: tabular-nums; opacity: .9; }
  .ed-row.set .val { color: #f6d67a; font-weight: 700; }
  .ed-row .rs { background: none; border: 0; color: inherit; opacity: .5; cursor: pointer; font-size: 14px; padding: 0; }
  .ed-row .rs:hover { opacity: 1; }
  .ed-row .rs[disabled] { visibility: hidden; }
  .ed-text { margin: 4px 0 8px; }
  .ed-text label { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-bottom: 2px; }
  .ed-text label .muted { margin-left: auto; font-size: 11.5px; }
  .ed-text textarea { width: 100%; box-sizing: border-box; min-height: 52px; resize: vertical; font: 14px/1.35 "EB Garamond", var(--serif); background: #f6ecd2; color: #2b1d10; border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; }
  .ed-text.set textarea { border-color: #f6d67a; box-shadow: 0 0 0 1px #f6d67a; }
  .ed-text .rs { background: none; border: 0; color: inherit; opacity: .6; cursor: pointer; font-size: 13px; padding: 0 2px; }
  .ed-text .rs[disabled] { visibility: hidden; }
  .ed-icons { display: flex; flex-wrap: wrap; gap: 2px; margin: 2px 0 6px; }
  .ed-icons button { background: rgba(255,255,255,.06); border: 1px solid transparent; border-radius: 4px; padding: 1px; cursor: pointer; line-height: 0; }
  .ed-icons button:hover { border-color: var(--gold); }
  .ed-icons .ico { width: 20px; height: 20px; }
  .ed-check { display: flex; gap: 6px; align-items: center; font-size: 13px; padding: 2px 0 2px 2px; }
  .ed-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  textarea.ed-json { width: 100%; height: 220px; font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; background: #120d09; color: #e9dab2; border: 1px solid var(--line); border-radius: 6px; padding: 8px; box-sizing: border-box; }
  .ed-steps { margin: 8px 0; padding-left: 20px; line-height: 1.45; }
  .ed-steps li { margin: 4px 0; }
  @media (max-width: 1000px) {
    html, body { overflow: auto; height: auto; }
    .ed { grid-template-columns: 1fr; grid-template-rows: auto; height: auto; }
    .ed-list { border-right: 0; border-bottom: 1px solid var(--line); max-height: 220px; }
    .ed-ctl { border-left: 0; }
    .ed-big .card { font-size: var(--ed-px, 19px); }
  }
</style>
</head>
<body>
<div class="ed" id="ed">
  <div class="ed-top">
    <h1>Card layout editor</h1>
    <span class="ed-status" id="status"></span>
    <span class="spacer"></span>
    <button class="btn" id="btn-discard">Discard my changes…</button>
    <button class="btn primary" id="btn-save">Save to the game…</button>
  </div>
  <div class="ed-list">
    <input class="field" id="search" placeholder="Search cards">
    <div class="ed-filter" id="filters"></div>
    <div class="ed-items" id="items"></div>
  </div>
  <div class="ed-stage" id="stage"></div>
  <div class="ed-ctl" id="controls"></div>
</div>
<script type="module">
import { h, clear, modal, toast } from '../js/ui/dom.js';
import { cardEl, houseEl, loadArt, hasArt, savedLayouts, autoText, LAYOUT_PARTS, LAYOUT_BADGES } from '../js/ui/cardview.js';
import { ICONS } from '../js/ui/icons.js';
import { icon } from '../js/ui/dom.js';
import { CARDS, CARD_BY_ID } from '../js/engine/cards.js';
import { HOUSES, HOUSE_BY_ID } from '../js/engine/data.js';

const DRAFT_KEY = 'duelingdukes.layoutDrafts';
const params = new URLSearchParams(location.search);
await loadArt('../');

// Where "Save to the game" sends you: the repository this page is served from.
const REPO = (() => {
  const m = location.hostname.match(/^([\w-]+)\.github\.io$/);
  const seg = location.pathname.split('/').filter(Boolean)[0];
  return m && seg ? `${m[1]}/${seg}` : 'tdavidsm/DuelingDukes';
})();
const EDIT_URL = `https://github.com/${REPO}/edit/main/art/cards/layouts.json`;

// ------------------------------------------------------------ the cards
const ITEMS = [
  ...CARDS.map((c) => ({ id: c.id, name: c.name, kind: c.type, cost: c.cost })),
  ...HOUSES.map((x) => ({ id: x.id, name: x.name, kind: 'house', cost: null })),
];
const ITEM = Object.fromEntries(ITEMS.map((x) => [x.id, x]));
const COLOR = { project: '#3c7a4b', active: '#2f5d9b', event: '#a3322a', house: '#6a3fa0' };
const PART_NAME = { icons: 'Effect icons', explain: 'Explanation', words: 'Rules text', actions: 'Yearly action', flavor: 'Flavour text' };
const BADGE_NAME = { cost: 'Cost coin', tags: 'Tags', req: 'Requirement', fp: 'Favor seal', tokens: 'Counters' };

const render = (id, layout, opts = {}) => (ITEM[id].kind === 'house' ? houseEl(id, { layout, ...opts }) : cardEl(id, { layout, ...opts }));

// ------------------------------------------------------ drafts and saved
const saved = savedLayouts();
let drafts = {};
try { drafts = JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}') || {}; } catch { drafts = {}; }
const same = (a, b) => JSON.stringify(canon(a)) === JSON.stringify(canon(b));
// Drafts that now match what the game has are no longer drafts (e.g. once saved).
for (const id of Object.keys(drafts)) if (!ITEM[id] || same(drafts[id], saved.get(id))) delete drafts[id];
const persist = () => { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(drafts)); } catch { /* storage full */ } };
persist();

const current = (id) => (id in drafts ? drafts[id] : saved.get(id)) || null;
const isDraft = (id) => id in drafts;

// Sorted keys and no empty objects, so layouts compare and print the same way.
function canon(L) {
  if (!L || typeof L !== 'object') return null;
  if (Array.isArray(L)) return L;
  const out = {};
  for (const k of Object.keys(L).sort()) {
    const v = L[k];
    if (v && typeof v === 'object' && !Array.isArray(v)) {
      const c = canon(v);
      if (c) out[k] = c;
    } else if (v !== undefined && v !== null && v !== false) out[k] = v;
  }
  return Object.keys(out).length ? out : null;
}

function getPath(L, path) {
  let o = L;
  for (const k of path.split('.')) { if (!o || typeof o !== 'object') return undefined; o = o[k]; }
  return o;
}
function setPath(id, path, value) {
  const L = structuredClone(current(id) || {});
  const keys = path.split('.');
  let o = L;
  for (const k of keys.slice(0, -1)) { if (!o[k] || typeof o[k] !== 'object') o[k] = {}; o = o[k]; }
  if (value === undefined) delete o[keys.at(-1)];
  else o[keys.at(-1)] = value;
  const c = canon(L);
  if (same(c, saved.get(id))) delete drafts[id];
  else drafts[id] = c;
  persist();
}
const round = (v, step) => Math.round(v / step) * step;
const r2 = (v) => Math.round(v * 100) / 100;

// The whole layouts file: what the game has, with your changes on top.
function merged() {
  const cards = {};
  for (const [id, L] of saved) if (ITEM[id]) cards[id] = canon(L);
  for (const [id, L] of Object.entries(drafts)) { if (L) cards[id] = canon(L); else delete cards[id]; }
  for (const id of Object.keys(cards)) if (!cards[id]) delete cards[id];
  const ids = Object.keys(cards).sort();
  const lines = ids.map((id, i) => `    ${JSON.stringify(id)}: ${JSON.stringify(cards[id])}${i < ids.length - 1 ? ',' : ''}`);
  return `{\n  "v": 1,\n  "cards": {\n${lines.join('\n')}${lines.length ? '\n' : ''}  }\n}\n`;
}

// ----------------------------------------------------------- the list
let filter = params.get('filter') || 'art';
let sel = params.get('card') && ITEM[params.get('card')] ? params.get('card') : null;
const searchEl = document.getElementById('search');
const visible = () => {
  const q = searchEl.value.trim().toLowerCase();
  return ITEMS.filter((x) => {
    if (q && !x.name.toLowerCase().includes(q) && !x.id.includes(q)) return false;
    if (filter === 'art') return hasArt(x.id);
    if (filter === 'changed') return isDraft(x.id) || saved.has(x.id);
    if (filter === 'noart') return !hasArt(x.id);
    return true;
  });
};
function renderList() {
  clear(document.getElementById('filters')).append(...[['art', 'With pictures'], ['changed', 'Adjusted'], ['all', 'All'], ['noart', 'No picture']].map(([k, t]) =>
    h('button', { class: 'btn' + (filter === k ? ' on' : ''), onclick: () => { filter = k; renderList(); } }, t)));
  const list = visible();
  clear(document.getElementById('items')).append(...list.map((x) => h('button', {
    class: 'ed-item' + (x.id === sel ? ' on' : ''), dataset: { id: x.id }, onclick: () => select(x.id),
  },
  h('span', { class: 'dot', style: { background: COLOR[x.kind] } }),
  h('span', { class: 'nm' }, x.name),
  isDraft(x.id) ? h('span', { class: 'mk draft', title: 'Changed here, not yet saved to the game' }, '● unsaved')
    : saved.has(x.id) ? h('span', { class: 'mk saved', title: 'Has an adjusted layout in the game' }, '✓') : null,
  !hasArt(x.id) ? h('span', { class: 'mk noart', title: 'No picture yet' }, '–') : null)));
  if (!list.length) document.getElementById('items').append(h('p', { class: 'muted', style: { padding: '8px' } }, 'No cards match.'));
  const n = Object.keys(drafts).length;
  clear(document.getElementById('status')).append(n ? h('span', {}, h('b', {}, n), n === 1 ? ' card changed and not yet saved to the game' : ' cards changed and not yet saved to the game')
    : h('span', {}, `${saved.size} card${saved.size === 1 ? '' : 's'} with an adjusted layout in the game. Nothing unsaved.`));
}
searchEl.addEventListener('input', renderList);

function select(id) {
  sel = id;
  const u = new URL(location.href);
  u.searchParams.set('card', id);
  history.replaceState(null, '', u);
  renderList();
  renderStage();
  renderControls();
  document.querySelector(`.ed-item[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({ block: 'nearest' });
}
function step(d) {
  const list = visible();
  const i = list.findIndex((x) => x.id === sel);
  const next = list[(i + d + list.length) % list.length];
  if (next) select(next.id);
}

// ----------------------------------------------------------- the stage
const stage = document.getElementById('stage');
let big = null;
const bigPx = () => parseFloat(getComputedStyle(big).fontSize);

function renderStage() {
  if (!sel) { clear(stage).append(h('p', { class: 'ed-help' }, 'Choose a card on the left.')); return; }
  const L = current(sel);
  const it = ITEM[sel];
  const wrap = h('div', { class: 'ed-big', id: 'big' });
  big = render(sel, L, { counters: CARD_BY_ID[sel] && CARD_BY_ID[sel].token ? 2 : undefined });
  wrap.append(big);
  const fit = h('div', { id: 'fit' });
  clear(stage).append(
    h('div', { class: 'ed-nav' },
      h('button', { class: 'btn', title: 'Previous card ( [ )', onclick: () => step(-1) }, '◀'),
      h('h2', {}, it.name),
      h('button', { class: 'btn', title: 'Next card ( ] )', onclick: () => step(1) }, '▶')),
    h('p', { class: 'ed-help' }, 'Edit the wording in the Text boxes on the right. Drag the picture to move it, scroll on it to zoom, and drag its bottom edge to make it taller or shorter. Drag the title, coin, tags, seals and badges to move them. Drag a block of text up or down to change the space above it, or tick “Move freely” for a block (such as the flavour text) and drag it anywhere on the card. The panel on the right has every setting.'),
    wrap,
    fit,
    h('div', { class: 'ed-sizes' },
      h('figure', {}, render(sel, L), h('figcaption', {}, 'Full size, as in the card dialog')),
      h('figure', {}, render(sel, L, { small: true }), h('figcaption', {}, 'In your hand'))));
  attachDrag(wrap);
  requestAnimationFrame(checkFit);
}

// Is anything cut off? The frame hides overflow, so compare the bottom strip with the frame.
function overflowOf(card) {
  const frame = card.querySelector('.cf-frame');
  const type = card.querySelector('.cf-type');
  const body = card.querySelector('.cf-body');
  if (!frame || !type || !body) return false;
  const fr = frame.getBoundingClientRect();
  return type.getBoundingClientRect().bottom > fr.bottom + 1 || body.scrollHeight > body.clientHeight + 2;
}
function offCard(card) {
  const fr = card.querySelector('.cf-frame').getBoundingClientRect();
  return [...card.querySelectorAll('[data-float]')].filter((n) => {
    const r = n.getBoundingClientRect();
    return r.left < fr.left - 1 || r.top < fr.top - 1 || r.right > fr.right + 1 || r.bottom > fr.bottom + 1;
  }).map((n) => PART_NAME[n.dataset.float].toLowerCase());
}
function checkFit() {
  const box = document.getElementById('fit');
  if (!box || !big) return;
  const small = stage.querySelector('.ed-sizes .card.small');
  const bad = overflowOf(big);
  const badSmall = small && overflowOf(small);
  const off = offCard(big);
  box.className = bad || badSmall || off.length ? 'ed-warn' : 'ed-ok';
  box.textContent = bad ? 'Something is cut off at the bottom: shorten the picture, or shrink or narrow the text.'
    : off.length ? `The ${off.join(' and ')} hangs off the edge of the card.`
      : badSmall ? 'It fits at full size, but something is cut off on the hand-sized card.'
        : 'Everything fits.';
}

// Lift a block out of the panel exactly where it is now drawn, so ticking the box moves nothing.
function floatPart(k, on) {
  if (!on) {
    for (const key of ['pos', 'w', 'back']) setPath(sel, k + '.' + key, undefined);
    return;
  }
  const px = bigPx();
  const frame = big.querySelector('.cf-frame');
  const fb = frame.getBoundingClientRect();
  // Placed blocks are measured from just inside the frame's border.
  const fr = { left: fb.left + frame.clientLeft, top: fb.top + frame.clientTop };
  const nodes = [...big.querySelectorAll('.cf-body > ' + LAYOUT_PARTS[k])];
  if (!nodes.length) return;
  const rs = nodes.map((n) => n.getBoundingClientRect());
  const left = Math.min(...rs.map((r) => r.left));
  const top = Math.min(...rs.map((r) => r.top));
  const right = Math.max(...rs.map((r) => r.right));
  // Out of the panel it no longer shares the panel's text size (a busy card's
  // smaller text, or a size set for the whole panel), so carry that over.
  const L = current(sel) || {};
  const body = big.querySelector('.cf-body');
  const ratio = (parseFloat(getComputedStyle(body).fontSize) / px) * (getPath(L, 'body.size') || 1);
  const size = r2((getPath(L, k + '.size') || 1) * ratio);
  setPath(sel, k + '.size', Math.abs(size - 1) < 0.005 ? undefined : size);
  setPath(sel, k + '.y', undefined);
  setPath(sel, k + '.width', undefined);
  setPath(sel, k + '.w', r2((right - left) / px));
  setPath(sel, k + '.pos', [r2((left - fr.left) / px), r2((top - fr.top) / px)]);
}

// Redraw after a change, keeping the controls in step.
function changed(redrawControls = true) {
  renderStage();
  if (redrawControls) renderControls(); else syncControls();
  renderList();
}

// --------------------------------------------------------------- dragging
function attachDrag(wrap) {
  wrap.addEventListener('pointermove', (e) => {
    if (drag) return;
    const art = e.target.closest('.cf-art');
    if (art) art.classList.toggle('resize', art.getBoundingClientRect().bottom - e.clientY < 10);
  });
  wrap.addEventListener('pointerdown', (e) => {
    const card = wrap.querySelector('.card');
    const px = bigPx();
    const L = current(sel) || {};
    let target = null;
    for (const [k, s] of Object.entries(LAYOUT_BADGES)) {
      const n = card.querySelector(':scope > ' + s);
      if (n && n.contains(e.target)) target = { badge: k };
    }
    const fl = e.target.closest('[data-float]');
    if (!target && fl && card.contains(fl)) target = { float: fl.dataset.float };
    if (!target && e.target.closest('.cf-title, .cf-ribbon')) target = { title: true };
    if (!target) {
      const bodyChild = [...card.querySelectorAll('.cf-body > *')].find((n) => n.contains(e.target));
      if (bodyChild) {
        const part = Object.entries(LAYOUT_PARTS).find(([, s]) => bodyChild.matches(s));
        if (part) target = { part: part[0] };
      }
    }
    const art = e.target.closest('.cf-art');
    if (!target && art) {
      const r = art.getBoundingClientRect();
      target = r.bottom - e.clientY < 10 ? { artH: r.height / px } : { pan: { w: r.width, h: r.height } };
    }
    if (!target) return;
    e.preventDefault();
    const start = { x: e.clientX, y: e.clientY };
    const base = {
      badge: target.badge ? (getPath(L, 'badges.' + target.badge) || [0, 0]) : null,
      title: [getPath(L, 'title.x') || 0, getPath(L, 'title.y') || 0],
      part: target.part ? getPath(L, target.part + '.y') || 0 : 0,
      float: target.float ? getPath(L, target.float + '.pos') || [0, 0] : null,
      ax: getPath(L, 'art.x') ?? 50,
      ay: getPath(L, 'art.y') ?? 50,
    };
    drag = (ev) => {
      const dx = (ev.clientX - start.x) / px;
      const dy = (ev.clientY - start.y) / px;
      if (target.badge) setPath(sel, 'badges.' + target.badge, [r2(round(base.badge[0] + dx, 0.05)), r2(round(base.badge[1] + dy, 0.05))]);
      else if (target.title) { setPath(sel, 'title.x', r2(round(base.title[0] + dx, 0.05)) || undefined); setPath(sel, 'title.y', r2(round(base.title[1] + dy, 0.05)) || undefined); }
      else if (target.float) setPath(sel, target.float + '.pos', [r2(round(base.float[0] + dx, 0.05)), r2(round(base.float[1] + dy, 0.05))]);
      else if (target.part) setPath(sel, target.part + '.y', r2(round(base.part + dy, 0.05)) || undefined);
      else if (target.artH) setPath(sel, 'art.h', r2(Math.max(2, Math.min(18, round(target.artH + dy, 0.1)))));
      else if (target.pan) {
        const zoom = getPath(current(sel), 'art.zoom') || 1;
        const k = 100 / Math.max(0.35, zoom - 1 + 0.35);
        setPath(sel, 'art.x', Math.round(Math.max(0, Math.min(100, base.ax - (ev.clientX - start.x) / target.pan.w * k))));
        setPath(sel, 'art.y', Math.round(Math.max(0, Math.min(100, base.ay - (ev.clientY - start.y) / target.pan.h * k))));
      }
      changed(false);
    };
    const up = () => { window.removeEventListener('pointermove', drag); window.removeEventListener('pointerup', up); drag = null; renderControls(); };
    window.addEventListener('pointermove', drag);
    window.addEventListener('pointerup', up);
  });
  wrap.addEventListener('wheel', (e) => {
    if (!e.target.closest('.cf-art')) return;
    e.preventDefault();
    const zoom = getPath(current(sel), 'art.zoom') || 1;
    const z = r2(Math.max(1, Math.min(3, zoom * (e.deltaY < 0 ? 1.06 : 1 / 1.06))));
    setPath(sel, 'art.zoom', z <= 1.001 ? undefined : z);
    changed(false);
  }, { passive: false });
}
let drag = null;

// -------------------------------------------------------------- controls
const ctlEl = document.getElementById('controls');
// Automatic values, read from the card as drawn without adjustments.
function automatic(id) {
  // Drawn with your wording (so added text gets its controls) but no other adjustments.
  const t = getPath(current(id), 'text');
  const probe = render(id, t ? { text: t } : null);
  probe.style.cssText = 'position:absolute;left:-9999px;top:0;font-size:20px';
  document.body.append(probe);
  const px = 20;
  const art = probe.querySelector('.cf-art');
  const body = probe.querySelector('.cf-body');
  const cs = body ? getComputedStyle(body) : null;
  const out = {
    'art.h': art ? r2(art.getBoundingClientRect().height / px) : 8,
    'body.padX': cs ? r2(parseFloat(cs.paddingLeft) / px) : 0.6,
    'body.gap': cs ? r2(parseFloat(cs.rowGap || cs.gap) / px) : 0.32,
    parts: Object.keys(LAYOUT_PARTS).filter((k) => body && body.querySelector(':scope > ' + LAYOUT_PARTS[k])),
    badges: Object.keys(LAYOUT_BADGES).filter((k) => probe.querySelector(':scope > ' + LAYOUT_BADGES[k])),
  };
  probe.remove();
  return out;
}

const ROWS = [];
let automaticParts = '';
function slider(path, label, { min, max, step, def, unit = '', fmt = (v) => v, onRemove }) {
  const L = current(sel);
  const v = getPath(L, path);
  const isSet = v !== undefined;
  const val = isSet ? v : def;
  const input = h('input', { type: 'range', min, max, step, value: val });
  const out = h('span', { class: 'val' }, fmt(val) + unit);
  const reset = h('button', { class: 'rs', title: 'Back to automatic', disabled: !isSet, onclick: () => { setPath(sel, path, undefined); if (onRemove) onRemove(); changed(); } }, '↺');
  input.addEventListener('input', () => { const n = r2(+input.value); setPath(sel, path, n); out.textContent = fmt(n) + unit; changed(false); });
  input.addEventListener('change', () => renderControls());
  const row = h('div', { class: 'ed-row' + (isSet ? ' set' : ''), dataset: { path } }, h('span', {}, label), input, out, reset);
  ROWS.push({ path, input, out, row, def, unit, fmt, reset });
  return row;
}
function syncControls() {
  const L = current(sel);
  for (const r of ROWS) {
    const v = getPath(L, r.path);
    const val = v !== undefined ? v : r.def;
    if (document.activeElement !== r.input) r.input.value = val;
    r.out.textContent = r.fmt(val) + r.unit;
    r.row.classList.toggle('set', v !== undefined);
    r.reset.disabled = v === undefined;
  }
}
// Pointing at a group outlines what it changes on the big card.
function hlOn(group, sels) {
  group.addEventListener('mouseenter', () => { for (const s of sels) big && big.querySelectorAll(s).forEach((n) => n.classList.add('ed-hl')); });
  group.addEventListener('mouseleave', () => { big && big.querySelectorAll('.ed-hl').forEach((n) => n.classList.remove('ed-hl')); });
  return group;
}

function renderControls() {
  ROWS.length = 0;
  clear(ctlEl);
  if (!sel) return;
  const auto = automatic(sel);
  automaticParts = auto.parts.join();
  const L = current(sel);
  const group = (title, sels, ...rows) => hlOn(h('div', { class: 'ed-group' }, h('h3', {}, title), ...rows), sels);
  const pct = (v) => Math.round(v * 100);
  ctlEl.append(
    textGroup(),
    group('Picture', ['.cf-art'],
      slider('art.h', 'Height', { min: 2, max: 18, step: 0.1, def: auto['art.h'], unit: 'em' }),
      slider('art.zoom', 'Zoom', { min: 1, max: 3, step: 0.01, def: 1, fmt: (v) => '×' + v }),
      slider('art.x', 'Left – right', { min: 0, max: 100, step: 1, def: 50, unit: '%' }),
      slider('art.y', 'Top – bottom', { min: 0, max: 100, step: 1, def: 50, unit: '%' })),
    group('Title', ['.cf-title'],
      slider('title.size', 'Size', { min: 0.5, max: 1.6, step: 0.01, def: 1, fmt: pct, unit: '%' }),
      slider('title.x', 'Across', { min: -4, max: 4, step: 0.05, def: 0, unit: 'em' }),
      slider('title.y', 'Up – down', { min: -1.5, max: 1.5, step: 0.05, def: 0, unit: 'em' })),
    group('Text panel', ['.cf-body'],
      slider('body.size', 'Text size', { min: 0.6, max: 1.4, step: 0.01, def: 1, fmt: pct, unit: '%' }),
      slider('body.padX', 'Side margins', { min: 0, max: 3, step: 0.05, def: auto['body.padX'], unit: 'em' }),
      slider('body.gap', 'Spacing', { min: 0, max: 1.5, step: 0.02, def: auto['body.gap'], unit: 'em' })),
    ...auto.parts.map((k) => {
      const placed = Array.isArray(getPath(L, k + '.pos'));
      const check = (label, path, onChange) => h('label', { class: 'ed-check' }, h('input', {
        type: 'checkbox', checked: !!getPath(L, path), dataset: { check: path },
        onchange: (e) => { onChange(e.target.checked); changed(); },
      }), label);
      return group(PART_NAME[k], [':scope .cf-body > ' + LAYOUT_PARTS[k], `:scope [data-float="${k}"]`],
        slider(k + '.size', 'Size', { min: 0.5, max: 1.8, step: 0.01, def: 1, fmt: pct, unit: '%' }),
        ...(placed ? [
          slider(k + '.pos.0', 'Across', { min: -1, max: 16, step: 0.05, def: 0, unit: 'em' }),
          slider(k + '.pos.1', 'Down', { min: -1, max: 23, step: 0.05, def: 0, unit: 'em' }),
          slider(k + '.w', 'Width', { min: 2, max: 16.5, step: 0.05, def: 15, unit: 'em' }),
          check('Parchment backing (for text over the picture)', k + '.back', (on) => setPath(sel, k + '.back', on || undefined)),
        ] : [
          slider(k + '.width', 'Width', { min: 30, max: 100, step: 1, def: 100, unit: '%' }),
          slider(k + '.y', 'Space above', { min: -2, max: 4, step: 0.05, def: 0, unit: 'em' }),
        ]),
        check('Move freely: lift it out of the text panel and drag it anywhere', k + '.pos', (on) => floatPart(k, on)),
        check('Hide it', k + '.hide', (on) => setPath(sel, k + '.hide', on || undefined)));
    }),
    auto.badges.length ? group('Badges', auto.badges.map((k) => ':scope > ' + LAYOUT_BADGES[k]),
      h('p', { class: 'muted', style: { fontSize: '12.5px', margin: '0 0 4px' } }, 'Drag them on the card. Moved badges:'),
      ...auto.badges.map((k) => {
        const b = getPath(L, 'badges.' + k);
        return h('div', { class: 'ed-row' + (b ? ' set' : '') }, h('span', {}, BADGE_NAME[k]), h('span', { class: 'muted' }, b ? `${b[0]}, ${b[1]} em` : 'not moved'), h('span'),
          h('button', { class: 'rs', title: 'Put it back', disabled: !b, onclick: () => { setPath(sel, 'badges.' + k, undefined); changed(); } }, '↺'));
      })) : null,
    h('div', { class: 'ed-actions' },
      h('button', { class: 'btn', id: 'btn-reset-card', disabled: !L, onclick: () => { if (saved.has(sel)) drafts[sel] = null; else delete drafts[sel]; persist(); changed(); } }, 'Automatic layout for this card'),
      isDraft(sel) && saved.has(sel) ? h('button', { class: 'btn', onclick: () => { delete drafts[sel]; persist(); changed(); } }, 'Undo my changes') : null),
    h('p', { class: 'muted', style: { fontSize: '12.5px' } }, isDraft(sel) ? 'Changed here. Use “Save to the game” to make it permanent.'
      : saved.has(sel) ? 'This layout is in the game.' : 'Automatic layout, as the game draws it.'));
}

// ---------------------------------------------------------------- the text
// Leaving a text box can add or remove controls (text added to a card gets its
// own size and position controls), so the panel is rebuilt then, but only once
// the next click has landed, and with the cursor kept in the box now in use.
function refreshKeepingFocus() {
  setTimeout(() => {
    const before = automaticParts;
    const now = automatic(sel).parts.join();
    if (before === now) return;
    const a = document.activeElement;
    const key = a && a.dataset && a.dataset.text;
    const pos = key ? [a.selectionStart, a.selectionEnd] : null;
    const top = ctlEl.scrollTop;
    renderControls();
    ctlEl.scrollTop = top;
    if (key) {
      const n = ctlEl.querySelector(`textarea[data-text="${key}"]`);
      if (n) { n.focus(); n.setSelectionRange(pos[0], pos[1]); lastBox = n; }
    }
  }, 0);
}
// The card's wording. Each box starts with the text the game prints; whatever
// you change is kept for this card, and ↺ goes back to the game's own text.
const ICON_PICKS = ['gold', 'stone', 'ore', 'food', 'rm', 'lux', 'card', 'rf', 'fp', 'building', 'military', 'trade', 'farming', 'faith', 'scholar', 'court', 'culture',
  'tok-noble', 'tok-acolyte', 'tok-scholar', 'tok-worker', 'tok-artisan', 'settlers', 'soldiers', 'knights', 'caravan', 'road', 'church', 'cathedral', 'city', 'power', 'wealth']
  .filter((n) => ICONS[n]);
let lastBox = null;
function textGroup() {
  const auto = autoText(sel);
  const L = current(sel);
  const isHouse = ITEM[sel].kind === 'house';
  const box = (key, label, autoVal, note) => {
    const v = getPath(L, 'text.' + key);
    const isSet = typeof v === 'string';
    const ta = h('textarea', { dataset: { text: key }, rows: Math.min(6, Math.max(2, String(isSet ? v : autoVal || '').split('\n').length + 1)) });
    ta.value = isSet ? v : autoVal || '';
    const wrap = h('div', { class: 'ed-text' + (isSet ? ' set' : '') });
    const reset = h('button', { class: 'rs', title: 'Back to the game’s own text', disabled: !isSet, onclick: () => { setPath(sel, 'text.' + key, undefined); changed(); } }, '↺');
    ta.addEventListener('focus', () => { lastBox = ta; });
    ta.addEventListener('input', () => {
      // Matching the game's own text again is the same as not changing it.
      setPath(sel, 'text.' + key, ta.value === (autoVal || '') ? undefined : ta.value);
      wrap.classList.toggle('set', ta.value !== (autoVal || ''));
      reset.disabled = ta.value === (autoVal || '');
      changed(false);
    });
    ta.addEventListener('change', refreshKeepingFocus);
    wrap.append(h('label', {}, label, note ? h('span', { class: 'muted' }, note) : null, reset), ta);
    return wrap;
  };
  const actBoxes = auto.actions.map((a, i) => {
    const v = getPath(L, 'text.actions');
    const cur = Array.isArray(v) && typeof v[i] === 'string' && v[i] ? v[i] : null;
    const ta = h('textarea', { dataset: { text: 'actions.' + i }, rows: 2, placeholder: 'Leave empty to draw it with icons' });
    ta.value = cur || '';
    const wrap = h('div', { class: 'ed-text' + (cur ? ' set' : '') });
    ta.addEventListener('focus', () => { lastBox = ta; });
    ta.addEventListener('input', () => {
      const arr = Array.from({ length: auto.actions.length }, (_, k) => (Array.isArray(getPath(current(sel), 'text.actions')) ? getPath(current(sel), 'text.actions')[k] || '' : ''));
      arr[i] = ta.value;
      setPath(sel, 'text.actions', arr.some((x) => x.trim()) ? arr : undefined);
      wrap.classList.toggle('set', !!ta.value.trim());
      changed(false);
    });
    ta.addEventListener('change', refreshKeepingFocus);
    wrap.append(h('label', {}, auto.actions.length > 1 ? `Yearly action ${i + 1} in words` : 'Yearly action in words',
      h('span', { class: 'muted', title: a }, 'drawn as icons unless you write it out'),
      h('button', { class: 'rs', title: 'Fill in the game’s wording', onclick: () => { ta.value = a; ta.dispatchEvent(new Event('input')); ta.focus(); } }, '✎')), ta);
    return wrap;
  });
  const picker = h('div', { class: 'ed-icons', title: 'Click to put an icon into the text box you last clicked in' },
    ICON_PICKS.map((n) => h('button', {
      title: `{${n}}`,
      onmousedown: (e) => e.preventDefault(),
      onclick: () => {
        const ta = lastBox && document.body.contains(lastBox) ? lastBox : ctlEl.querySelector('textarea');
        if (!ta) return;
        const s = ta.selectionStart ?? ta.value.length;
        ta.value = ta.value.slice(0, s) + `{${n}}` + ta.value.slice(ta.selectionEnd ?? s);
        ta.focus();
        ta.selectionStart = ta.selectionEnd = s + n.length + 2;
        ta.dispatchEvent(new Event('input'));
      },
    }, icon(n))));
  return hlOn(h('div', { class: 'ed-group' },
    h('h3', {}, 'Text', h('span', { class: 'muted' }, 'new line = new paragraph')),
    box('flavor', isHouse ? 'Motto' : 'Flavour text', auto.flavor, auto.flavor ? '' : 'none yet: write one to add it'),
    box('words', 'Rules text', auto.words, auto.words ? '' : 'none: anything you write is added'),
    auto.explain !== null ? box('explain', 'Explanation of the icons', auto.explain) : null,
    ...actBoxes,
    h('p', { class: 'muted', style: { fontSize: '12px', margin: '2px 0' } }, 'Icons: write {gold}, {stone}, {fp} and so on, or click one below. Empty a box to take that text off the card.'),
    picker), ['.cf-body']);
}

// ---------------------------------------------------------------- saving
document.getElementById('btn-save').addEventListener('click', () => {
  const text = merged();
  const n = Object.keys(drafts).length;
  const area = h('textarea', { class: 'ed-json', readonly: true, id: 'layout-json' });
  area.value = text;
  const copy = async () => {
    try { await navigator.clipboard.writeText(text); toast('Copied the layouts'); } catch { area.select(); document.execCommand('copy'); toast('Copied the layouts'); }
  };
  const download = () => {
    const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: 'application/json' })), download: 'layouts.json' });
    document.body.append(a); a.click(); a.remove();
  };
  modal({
    title: 'Save the layouts to the game',
    wide: true,
    body: h('div', {},
      h('p', {}, n ? `${n} card${n === 1 ? '' : 's'} changed. This file holds every adjusted card, yours included.` : 'Nothing has changed since the last save, but here is the file.'),
      h('ol', { class: 'ed-steps' },
        h('li', {}, h('button', { class: 'btn primary', id: 'btn-copy', onclick: copy }, 'Copy the layouts')),
        h('li', {}, h('a', { class: 'btn', href: EDIT_URL, target: '_blank', rel: 'noopener', id: 'btn-github' }, 'Open layouts.json on GitHub'),
          ' (signed in). Select everything in the file, paste over it, and press ', h('b', {}, 'Commit changes'), '.'),
        h('li', {}, 'The game picks the new layouts up a few minutes later. Reload this page then: cards that have been saved lose their “unsaved” mark.')),
      h('p', { class: 'muted' }, 'Or ', h('a', { href: '#', id: 'btn-download', style: { color: 'var(--gold-2)' }, onclick: (e) => { e.preventDefault(); download(); } }, 'download layouts.json'),
        ' and put it in your DuelingDukes Drive folder for Claude to add.'),
      area),
  });
});

document.getElementById('btn-discard').addEventListener('click', () => {
  const n = Object.keys(drafts).length;
  if (!n) { toast('There are no unsaved changes'); return; }
  const m = modal({
    title: 'Discard your changes?',
    body: h('div', {}, h('p', {}, `This throws away the unsaved changes to ${n} card${n === 1 ? '' : 's'}. Layouts already in the game are kept.`),
      h('div', { class: 'btn-row' },
        h('button', { class: 'btn danger', id: 'btn-discard-yes', onclick: () => { drafts = {}; persist(); m.close(); changed(); } }, 'Discard'),
        h('button', { class: 'btn', onclick: () => m.close() }, 'Keep them'))),
  });
});

document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === '[' ) step(-1);
  if (e.key === ']') step(1);
});

renderList();
if (!sel) sel = visible()[0]?.id || ITEMS[0].id;
select(sel);
document.body.dataset.ready = '1';
</script>
</body>
</html>
